<svg width="800" height="1066" viewBox="0 0 800 1066" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm luxury studio ambient wash -->
    <radialGradient id="studio-bg-wide-trouser-1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E9E2D6" />
    </radialGradient>
    <!-- Soft luxury floor shadow -->
    <filter id="soft-ground-shadow-wide-trouser-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2A2826" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Warm Ivory Studio Background -->
  <rect width="800" height="1066" fill="url(#studio-bg-wide-trouser-1)" />

  <!-- Studio Ambient Ground Reflection -->
  <ellipse cx="400" cy="790" rx="200" ry="20" fill="#DDD6C9" opacity="0.45" filter="blur(6px)" />

  <!-- Garment Presentation -->
  <g filter="url(#soft-ground-shadow-wide-trouser-1)">
    
      <!-- Trousers Silhouette -->
      <path d="M 315 280 L 485 280 L 505 760 L 435 765 L 400 480 L 365 765 L 295 760 Z" fill="#1A1918" />
    
    
      <!-- Waistband -->
      <rect x="315" y="280" width="170" height="24" fill="#11100F" opacity="0.4" />
      <!-- Single Pleats & Creases -->
      <line x1="365" y1="304" x2="355" y2="760" stroke="#11100F" stroke-width="2" opacity="0.45" stroke-linecap="round" />
      <line x1="435" y1="304" x2="445" y2="760" stroke="#11100F" stroke-width="2" opacity="0.45" stroke-linecap="round" />
    
  </g>
</svg>