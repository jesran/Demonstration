<svg width="800" height="1066" viewBox="0 0 800 1066" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm luxury studio ambient wash -->
    <radialGradient id="studio-bg-heavyweight-tee-3" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E9E2D6" />
    </radialGradient>
    <!-- Soft luxury floor shadow -->
    <filter id="soft-ground-shadow-heavyweight-tee-3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2A2826" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Warm Ivory Studio Background -->
  <rect width="800" height="1066" fill="url(#studio-bg-heavyweight-tee-3)" />

  <!-- Studio Ambient Ground Reflection -->
  <ellipse cx="400" cy="790" rx="200" ry="20" fill="#DDD6C9" opacity="0.45" filter="blur(6px)" />

  <!-- Garment Presentation -->
  <g filter="url(#soft-ground-shadow-heavyweight-tee-3)">
    
      <!-- T-Shirt Silhouette -->
      <path d="M 285 305 L 360 275 Q 400 310 440 275 L 515 305 L 585 410 L 530 435 L 500 395 L 495 725 L 305 725 L 300 395 L 270 435 L 215 410 Z" fill="#242322" />
    
    
      <!-- Collar Ribbing -->
      <path d="M 360 275 Q 400 315 440 275 Q 400 325 360 275 Z" fill="#161514" opacity="0.6" />
      <!-- Subtle Drape & Creases -->
      <path d="M 320 420 Q 350 480 340 700" stroke="#161514" stroke-width="2.5" opacity="0.35" fill="none" stroke-linecap="round" />
      <path d="M 480 420 Q 450 480 460 700" stroke="#161514" stroke-width="2.5" opacity="0.35" fill="none" stroke-linecap="round" />
      <path d="M 395 330 L 405 710" stroke="#161514" stroke-width="1.5" opacity="0.25" fill="none" />
    
  </g>
</svg>