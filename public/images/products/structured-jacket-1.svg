<svg width="800" height="1066" viewBox="0 0 800 1066" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm luxury studio ambient wash -->
    <radialGradient id="studio-bg-structured-jacket-1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="65%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E9E2D6" />
    </radialGradient>
    <!-- Soft luxury floor shadow -->
    <filter id="soft-ground-shadow-structured-jacket-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2A2826" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Warm Ivory Studio Background -->
  <rect width="800" height="1066" fill="url(#studio-bg-structured-jacket-1)" />

  <!-- Studio Ambient Ground Reflection -->
  <ellipse cx="400" cy="790" rx="200" ry="20" fill="#DDD6C9" opacity="0.45" filter="blur(6px)" />

  <!-- Garment Presentation -->
  <g filter="url(#soft-ground-shadow-structured-jacket-1)">
    
      <!-- Jacket / Overshirt Silhouette -->
      <path d="M 280 315 L 350 280 L 450 280 L 520 315 L 590 440 L 535 465 L 505 415 L 495 730 L 305 730 L 295 415 L 265 465 L 210 440 Z" fill="#151413" />
    
    
      <!-- Lapels / Collar -->
      <path d="M 350 280 L 375 350 L 400 310 L 425 350 L 450 280" stroke="#0C0C0B" stroke-width="2" fill="none" opacity="0.7" />
      <!-- Center Placket -->
      <line x1="400" y1="310" x2="400" y2="730" stroke="#0C0C0B" stroke-width="2" opacity="0.6" />
      <!-- Chest Pockets -->
      <rect x="330" y="400" width="55" height="65" stroke="#0C0C0B" stroke-width="1.5" fill="none" opacity="0.4" />
      <rect x="415" y="400" width="55" height="65" stroke="#0C0C0B" stroke-width="1.5" fill="none" opacity="0.4" />
    
  </g>
</svg>